name: Daily ETL Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC (after market close)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: |
          cd etl
          pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_SEED_DATA: ${{ secrets.USE_SEED_DATA || 'true' }}
        run: |
          cd etl
          python run_all.py

      - name: Notify on failure
        if: failure()
        run: echo "ETL pipeline failed. Check logs for details."
        # Add notification integration here (Slack, email, etc.)

# Required GitHub Secrets:
# - DATABASE_URL: PostgreSQL connection string
# - FRED_API_KEY (optional): FRED API key
# - ALPHA_VANTAGE_API_KEY (optional): Alpha Vantage API key
# - FMP_API_KEY (optional): FMP API key
# - OPENAI_API_KEY (optional): OpenAI API key
# - USE_SEED_DATA (optional): Set to "false" to use real APIs
